name: Fork release

on:
  push:
    tags: ['v*-rul.*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build
        required: true
        default: v0.7.1-rul.1

permissions:
  contents: read

concurrency:
  group: fork-release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'rul/wayle'
    runs-on: ubuntu-latest
    container: debian:13
    timeout-minutes: 60
    steps:
      - name: Install build and packaging dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential ca-certificates clang cmake curl debhelper \
            desktop-file-utils dpkg-dev git pkg-config \
            libfftw3-dev libgtk-4-dev libgtk4-layer-shell-dev \
            libgtksourceview-5-dev libpipewire-0.3-dev libpulse-dev \
            libudev-dev libxkbcommon-dev
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
          fetch-depth: 0
      - name: Configure Git and Rust
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs -o /tmp/rustup.sh
          sh /tmp/rustup.sh -y --profile minimal --default-toolchain 1.93.0
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Validate release version
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          VERSION=$(sed -n '/\[workspace.package\]/,/^\[/{s/^version = "\(.*\)"/\1/p;}' Cargo.toml)
          test "$RELEASE_TAG" = "v$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          git merge-base --is-ancestor 9477bd2351973c8e1da8e703b8ecfec69bcc6055 HEAD
          git merge-base --is-ancestor 70876caedbb1e9680fc3a6e3b148595cf1e7d227 HEAD
      - name: Test and build both applications
        run: |
          cargo test --locked -p wayle-config -p wayle-shell -p wayle-network --lib
          cargo build --release --locked -p wayle -p wayle-settings
          target/release/wayle --version
          ldd target/release/wayle
          ldd target/release/wayle-settings
      - name: Package archive and Debian package
        env:
          DEBFULLNAME: Raul Benencia
          DEBEMAIL: id@rbenencia.name
        run: |
          ./scripts/ci/build-archive.sh target/release "$VERSION" x86_64
          ./scripts/ci/build-packages.sh "wayle-$VERSION-x86_64-linux.tar.gz" "$VERSION" deb
          mkdir -p dist
          cp "wayle-$VERSION-x86_64-linux.tar.gz" dist/
          cp debbuild/DEBS/amd64/*.deb dist/
          cp "docs/releases/v$VERSION.md" dist/RELEASE-NOTES.md
          cd dist
          sha256sum *.tar.gz *.deb > SHA256SUMS
          sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: fork-release
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: fork-release
          path: dist
      - name: Publish combined fork release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          cd dist
          sha256sum -c SHA256SUMS
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft --prerelease \
              --title "Wayle $RELEASE_TAG — drawers and Wi-Fi adapters" \
              --notes-file RELEASE-NOTES.md
          fi
          gh release upload "$RELEASE_TAG" *.tar.gz *.deb SHA256SUMS --clobber
          gh release edit "$RELEASE_TAG" --draft=false --prerelease
